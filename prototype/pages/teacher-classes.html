<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>我的班级 | 薪火传原型</title>
<link rel="stylesheet" href="../assets/css/prototype.css" />
</head>
<body>
<div class="device">
  <div class="screen">
    <div class="statusbar" data-statusbar></div>

    <header class="navbar">
      <div class="navbar__title">我的班级</div>
      <button class="icon-btn" data-toast="一个班级 V1.0 只设置一名当前教师">
        <i data-icon="shield" data-size="20"></i>
      </button>
    </header>

    <main class="page">
      <div class="searchbox">
        <i data-icon="search" data-size="18"></i>
        <span>搜索班级</span>
      </div>

      <div class="segmented mt-12">
        <span class="segmented__item is-on">全部</span>
        <span class="segmented__item">共读中</span>
        <span class="segmented__item">未开始</span>
        <span class="segmented__item">已结束</span>
      </div>

      <div class="section-title">正在共读</div>
      <div class="list">
        <div class="list-item" data-href="teacher-class.html" style="align-items:flex-start;padding:14px">
          <span class="avatar" style="background:linear-gradient(140deg,#8FC8A6,#4E8A66)">
            <i data-icon="group" data-size="19"></i>
          </span>
          <div class="grow">
            <div class="row row--between">
              <div class="list-item__title">四年级(2)班</div>
              <span class="badge badge--accent">共读中</span>
            </div>
            <div class="list-item__sub">当前共读《小王子》· 第 2 轮</div>
            <div class="row row--between mt-8">
              <span class="tiny dim">学生 34 · 已认领 28 · 分享 46</span>
              <span class="tiny" style="color:var(--c-primary);font-weight:600">进入</span>
            </div>
            <div class="meter mt-8"><span class="meter__fill" style="width:82%"></span></div>
          </div>
        </div>
      </div>

      <div class="section-title">其他班级</div>
      <div class="list">
        <div class="list-item" data-href="teacher-class.html" style="align-items:flex-start;padding:14px">
          <span class="avatar" style="background:linear-gradient(140deg,#93BEDC,#4B7FA8)">
            <i data-icon="group" data-size="19"></i>
          </span>
          <div class="grow">
            <div class="row row--between">
              <div class="list-item__title">四年级(1)班</div>
              <span class="badge">待开启</span>
            </div>
            <div class="list-item__sub">上一轮《草房子》已于 9 月 1 日结束</div>
            <div class="tiny dim mt-8">学生 36 · 已认领 36 · 分享 52</div>
          </div>
        </div>

        <div class="list-item" data-href="teacher-class.html" style="align-items:flex-start;padding:14px">
          <span class="avatar" style="background:linear-gradient(140deg,#C6B6DE,#5F4B84)">
            <i data-icon="group" data-size="19"></i>
          </span>
          <div class="grow">
            <div class="row row--between">
              <div class="list-item__title">三年级(3)班</div>
              <span class="badge">历史班级</span>
            </div>
            <div class="list-item__sub">去年带过的班级，数据长期保留</div>
            <div class="tiny dim mt-8">学生 31 · 已认领 31 · 分享 40</div>
          </div>
        </div>
      </div>

      <div class="card card--soft mt-16">
        <div class="row row--top gap-8">
          <i data-icon="shield" data-size="17" style="color:var(--c-text-3);margin-top:2px"></i>
          <div class="grow tiny muted">
            教师由后台预建档案，可以负责多个班级。历史教师关系会保留，历史班级的数据不会消失。
          </div>
        </div>
      </div>
    </main>

    <nav class="tabbar" data-tabbar="teacher" data-active="class"></nav>
  </div>
</div>
<script src="../assets/js/prototype.js"></script>
</body>
</html>
