<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>共读纪念卡 | 薪火传原型</title>
<link rel="stylesheet" href="../assets/css/prototype.css" />
</head>
<body>
<div class="device">
  <div class="screen">
    <div class="statusbar" data-statusbar></div>

    <header class="navbar">
      <button class="icon-btn" data-href="class-home.html" aria-label="返回">
        <i data-icon="back" data-size="22"></i>
      </button>
      <div class="navbar__title">我的共读纪念卡</div>
    </header>

    <main class="page">
      <!-- 推送提示 -->
      <div class="card card--primary card--tight">
        <div class="row gap-8">
          <i data-icon="spark" data-size="18" style="color:var(--c-primary-dark)"></i>
          <div class="grow small" style="color:var(--c-primary-dark)">
            这次共读已经结束，你的阅读纪念已经生成。
          </div>
        </div>
      </div>

      <!-- 纪念卡 -->
      <div class="memorial mt-16 fade-up">
        <div class="center" style="position:relative;z-index:1">
          <div class="tiny" style="letter-spacing:.24em;color:#A98A56">薪火传 · 书香伴</div>
          <div class="tiny dim mt-4">共读一本书 · 公益爱心活动</div>

          <div class="photo-ph photo-ph--blue" style="height:132px;margin:14px 0;border-radius:14px">
            <i data-icon="book" data-size="26"></i>
            <span>我的主题照片</span>
          </div>

          <div class="h2">《小王子》</div>
          <div class="tiny dim mt-4">圣埃克苏佩里 著</div>

          <div class="mt-12">
            <span class="pill-num" style="background:#F3E7CE">这本书的第<b>12</b>位小读者</span>
          </div>
        </div>

        <div class="divider divider--dashed" style="position:relative;z-index:1"></div>

        <div class="row" style="position:relative;z-index:1">
          <div class="stat"><span class="stat__num">3</span><span class="stat__label">分享</span></div>
          <div class="stat"><span class="stat__num">12</span><span class="stat__label">获赞</span></div>
          <div class="stat"><span class="stat__num">5</span><span class="stat__label">评论</span></div>
          <div class="stat"><span class="stat__num stat__num--gold">60</span><span class="stat__label">本次荣誉</span></div>
        </div>

        <div class="divider divider--dashed" style="position:relative;z-index:1"></div>

        <div style="position:relative;z-index:1">
          <div class="small muted">周老师的话</div>
          <div class="small mt-4">你能被这一句话打动，说明你已经读进去了。下本书，我们继续。</div>
        </div>

        <div class="row row--between mt-16" style="position:relative;z-index:1;font-size:11px;color:#A98A56">
          <span>完成时间 2026 年 9 月 10 日</span>
          <span>XH-000186</span>
        </div>
      </div>

      <!-- 生成 -->
      <div class="section-title">保存成图片</div>
      <div class="row gap-10">
        <button class="btn btn--primary grow" data-toast="已生成署名纪念图，保存到相册啦">
          <i data-icon="image" data-size="18"></i>署名版
        </button>
        <button class="btn btn--ghost grow" data-toast="已生成匿名纪念图，只显示“第 12 位小读者”">
          <i data-icon="shield" data-size="18"></i>匿名版
        </button>
      </div>
      <div class="tiny dim mt-8">
        署名版会写上你的名字；匿名版只显示“第 X 位小读者”，适合分享到更大的范围。
      </div>

      <div class="card card--soft mt-16">
        <div class="row row--top gap-8">
          <i data-icon="book" data-size="17" style="color:var(--c-accent);margin-top:2px"></i>
          <div class="grow tiny muted">
            这本书还会继续它的旅程，去到下一个班级、陪伴下一位小读者。你的第 12 位，会一直留在它的生命史里。
          </div>
        </div>
      </div>
    </main>

    <div class="bottom-bar bottom-bar--solid">
      <a class="btn btn--primary btn--block" href="archive-detail.html">查看这次阅读的完整档案</a>
      <a class="btn btn--ghost btn--block mt-8" href="home-empty.html">回到首页，读下一本书</a>
    </div>
  </div>
</div>
<script src="../assets/js/prototype.js"></script>
</body>
</html>
